name: Relieuse vers Lectrice C12
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  lectrice:
    if: startsWith(github.event.issue.title, '[RELIEUSE-LECTRICE]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s coordination/agents -p 'test_*.py'
      - name: Traiter la mission
        id: traiter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python3 coordination/agents/pont_relieuse_c12.py
      - name: Retourner le resultat dans l'issue
        if: steps.traiter.outputs.should_comment == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file commentaire-lectrice-c12.md
