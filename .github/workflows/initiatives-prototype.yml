name: Découverte initiatives fictives
on:
  push:
    branches: [feat/initiatives-decouverte-mobile-2026-10-30]
  pull_request:
    paths:
      - 'initiatives*'
      - 'decouvrir-initiatives.html'
      - 'tests/initiatives-core.test.mjs'
      - '.github/workflows/initiatives-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/initiatives-core.test.mjs

  browser-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le navigateur de test
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Tester le parcours mobile réel dans Chromium
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/interstice-http.log 2>&1 &
          node --test tests/initiatives-browser.test.mjs
      - name: Captures du prototype pour relecture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interstice-apercu-mobile-fictif
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
