name: Demo ateliers C11 sans IA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'coordination/agents/**'
      - '.github/workflows/demo-agents-c11.yml'
permissions:
  contents: read
jobs:
  demonstration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests hors ligne
        run: |
          python3 -m py_compile coordination/agents/demo_c11.py
          python3 -m unittest discover -s coordination/agents -p 'test_*.py'
      - name: Produire un rapport de demonstration
        run: python3 coordination/agents/demo_c11.py --sortie rapport-demo-c11.json
      - name: Produire un rapport lisible
        run: python3 coordination/agents/rapport_c11.py
      - name: Simuler une file de missions
        run: python3 coordination/agents/mission_queue_c11.py
      - name: Produire le tableau Relieuse
        run: python3 coordination/agents/tableau_relieuse_c11.py
      - name: Recuperer l'index central C10 (lecture seule)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${{ github.repository }}/contents/coordination/messagerie/MESSAGES_C10.md?ref=coordination%2Fcycle10-messagerie-v1-20261101" > index-messagerie-c10.md
          python3 coordination/agents/index_messagerie_c11.py --entree index-messagerie-c10.md --ref coordination/cycle10-messagerie-v1-20261101
      - name: Rapprocher les accuses verifies
        run: python3 coordination/agents/rapprochement_c11.py --index index-messagerie-c10.md --accuses coordination/agents/accuses_verifies_c10.json
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-demo-c11
          path: |
            rapport-demo-c11.json
            rapport-demo-c11.md
            file-missions-c11-rapport.json
            tableau-relieuse-c11.md
            tableau-courriers-c10.md
            rapprochement-accuses-c10.md
