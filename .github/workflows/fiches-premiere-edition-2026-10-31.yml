name: Graphiste premiere edition - banc de fiches
on:
  push:
    branches:
      - design/fiches-premiere-edition-contrat-2026-10-31
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maquette:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Tester maquette non publique
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/fiches-2026-10-31.log 2>&1 &
          node --test tests/fiches-premiere-edition-2026-10-31.test.mjs
          node --test tests/graphiste-3-passes-pages-reelles-2026-10-31.test.mjs
      - name: Captures et impression A4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiches-premiere-edition-captures-a4
          path: artifacts/*
          retention-days: 14
          if-no-files-found: warn
