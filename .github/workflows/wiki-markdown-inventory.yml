name: Wiki Markdown inventory (archive stage)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/inventory-wiki-markdown.mjs'
      - 'scripts/submit-wiki-inventory.mjs'
      - '.github/workflows/wiki-markdown-inventory.yml'
  push:
    branches: [main, fix/wiki-review-handoff-rebased-2026-10-30]
    paths:
      - 'coordination/**/*.md'
      - 'wiki/**/*.md'
      - 'encyclopedie/**/*.md'
      - 'scripts/inventory-wiki-markdown.mjs'
      - '.github/workflows/wiki-markdown-inventory.yml'
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  id-token: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build candidate inventory from GitHub main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: main
        run: node scripts/inventory-wiki-markdown.mjs
      - name: Synchronize private editorial staging on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/submit-wiki-inventory.mjs
      - name: Store inventory for editorial ingest
        uses: actions/upload-artifact@v4
        with:
          name: wiki-markdown-inventory
          path: artifacts/wiki-ingest-candidates.json
          retention-days: 14
