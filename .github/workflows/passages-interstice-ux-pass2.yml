name: Passages UX pass 2 QA
on:
  push:
    branches: [design/passages-interstice-ux-pass2-20261102]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/passages-ux2.log 2>&1 &
          node --test tests/passages-interstice-20261102.test.mjs tests/passages-interstice-ux-pass2.test.mjs
