name: C25 private integration decisions - no deployment
on:
  push:
    branches:
      - integration/c25-tech-private-editorial-review-20261114
    paths:
      - .github/workflows/c25-integration-decisions.yml
      - tests/c25-decision-review-gates.test.mjs
      - coordination/work/c25/**
      - coordination/REGISTRE_DECISIONS.md
  pull_request:
    branches:
      - work/c24-r6-regression-candidate-20261114
    paths:
      - .github/workflows/c25-integration-decisions.yml
      - tests/c25-decision-review-gates.test.mjs
      - coordination/work/c25/**
      - coordination/REGISTRE_DECISIONS.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-decisions:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify human decisions and reserved source-backed review batches
        run: node --test tests/c25-decision-review-gates.test.mjs tests/c22-reception-contract.test.mjs
      - name: Verify entire historical decisions register with existing C09 parser
        run: python3 -m unittest discover -s coordination/agents -p 'test_*.py'
      - name: Verify no private source path is authorized for Pages
        run: node scripts/security/public-boundary.mjs source .
