name: C14 Orchestratrice - moteur local sans IA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'coordination/agents/orchestrateur_c14.py'
      - 'coordination/agents/test_orchestrateur_c14.py'
      - 'coordination/agents/exemple_mission_c14.json'
      - '.github/workflows/orchestrateur-c14.yml'

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tests C14 hors ligne
        run: python3 -m unittest discover -s coordination/agents -p 'test_orchestrateur_c14.py' -v
      - name: Produire un rapport sur données fictives
        run: |
          python3 coordination/agents/orchestrateur_c14.py \
            --entree coordination/agents/exemple_mission_c14.json \
            --sortie rapport-c14.json \
            --markdown rapport-c14.md
      - name: Publier seulement l'artefact de CI
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-c14-demonstration
          path: |
            rapport-c14.json
            rapport-c14.md
          retention-days: 7
