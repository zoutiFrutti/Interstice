name: C07 master reception and Pages privacy gate
on:
  pull_request:
    branches: [main]
    paths:
      - '_config.yml'
      - 'index.html'
      - 'candidat.html'
      - 'archives.html'
      - 'assets/candidat.css'
      - 'coordination/work/c07/relieuse/check-candidate-site.test.mjs'
      - 'coordination/v2/work-c02-01/data/resources.json'
      - 'coordination/v2/work-c02-01/data/sources.json'
      - 'coordination/work/c07/developpeuse/master-v1/**'
      - 'coordination/work/c07/mediatheque/C07_MED_01B_MATRICE_219.md'
      - 'coordination/work/c07/relieuse/check-med-matrix.test.mjs'
      - 'coordination/work/c07/relieuse/check-public-tree-baseline.mjs'
      - 'coordination/work/c07/relieuse/check-pages-boundary*'
      - 'coordination/work/c07/relieuse/check-pages-content*'
      - 'coordination/work/c07/relieuse/check-public-locators*'
      - 'coordination/work/c07/relieuse/audit-public-tree*'
      - 'coordination/work/c07/relieuse/lec03-status-reception.test.mjs'
      - '.github/workflows/c07-master-reception.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  master-and-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect full public Git tree, counts only (audit, not a release approval)
        run: |
          node --test coordination/work/c07/relieuse/audit-public-tree.test.mjs
          node coordination/work/c07/relieuse/audit-public-tree.mjs
      - name: Check MED matrix preservation and private locator removal
        run: node --test coordination/work/c07/relieuse/check-med-matrix.test.mjs
      - name: Reject growth of unresolved links in public Git
        run: node coordination/work/c07/relieuse/check-public-tree-baseline.mjs
      - name: Fail if C02 registries contain direct Drive or Docs links
        run: node coordination/work/c07/relieuse/check-public-locators.mjs
      - name: Verify public registry gate unit tests
        run: node --test coordination/work/c07/relieuse/check-public-locators.test.mjs
      - name: Assert exact candidate and internal-only master
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --test coordination/work/c07/developpeuse/master-v1/test.mjs
          node coordination/work/c07/developpeuse/master-v1/build.mjs
      - name: Check editorial state isolation and held dossiers
        run: node --test coordination/work/c07/relieuse/lec03-status-reception.test.mjs
      - name: Assert boundary-gate unit tests
        run: node --test coordination/work/c07/relieuse/check-pages-boundary.test.mjs
      - name: Assert sensitive content gate with synthetic cases
        run: node --test coordination/work/c07/relieuse/check-pages-content.test.mjs
      - name: Check candidate navigation and safe doors
        run: node --test coordination/work/c07/relieuse/check-candidate-site.test.mjs
      - name: Reproduce Pages output without publishing
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - name: Block unexpected internal folders in actual Pages output
        run: node coordination/work/c07/relieuse/check-pages-boundary.mjs ./_site
      - name: Block direct Google file URLs inside allowed Pages files
        run: node coordination/work/c07/relieuse/check-pages-content.mjs ./_site
      - name: Keep a downloadable offline candidate for human review (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: interstice-c07-site-candidat
          path: ./_site/
          retention-days: 14
          if-no-files-found: error
