name: C07 master reception and Pages privacy gate
on:
  pull_request:
    branches: [main]
    paths:
      - '_config.yml'
      - 'coordination/work/c07/developpeuse/master-v1/**'
      - 'coordination/work/c07/relieuse/check-pages-boundary*'
      - '.github/workflows/c07-master-reception.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  master-and-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact candidate and internal-only master
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --test coordination/work/c07/developpeuse/master-v1/test.mjs
          node coordination/work/c07/developpeuse/master-v1/build.mjs
      - name: Assert boundary-gate unit tests
        run: node --test coordination/work/c07/relieuse/check-pages-boundary.test.mjs
      - name: Reproduce Pages output without publishing
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - name: Block unexpected internal folders in actual Pages output
        run: node coordination/work/c07/relieuse/check-pages-boundary.mjs ./_site
