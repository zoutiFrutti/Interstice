name: WORK NAV01 isolated navigation QA
on:
  pull_request:
    paths:
      - 'explorer.html'
      - 'assets/nav-01/**'
      - 'assets/identite/r7/**'
      - 'scripts/build-nav-preview.mjs'
      - 'scripts/reading/**'
      - 'scripts/build-editorial-review.mjs'
      - 'scripts/editorial-queue.mjs'
      - 'scripts/build-review-hub.mjs'
      - 'coordination/work/c07/EDITORIAL_QUEUE.json'
      - 'tests/nav01*'
      - 'tests/work-convergence-navigation.browser.test.mjs'
      - 'tests/nav01-zoom-extension/**'
      - 'coordination/work/nav-01/**'
      - 'coordination/work/c07/relieuse/check-reviewed-preservation*'
      - 'coordination/REGISTRE_DECISIONS.md'
      - 'coordination/agents/test_c20_work_decision_rows.py'
      - 'coordination/work/c07/faire-ensemble-pilot/**'
      - '.github/workflows/work-nav01-candidate.yml'
permissions:
  contents: read
jobs:
  navigation:
    # Playwright 1.56.1 supports Ubuntu 24.04; do not follow the moving latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      purge-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: interstice_purge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d interstice_purge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test candidate purge in isolated PostgreSQL WASM, no Supabase
        run: |
          npm ci --prefix coordination/work/c07/faire-ensemble-pilot --ignore-scripts --no-audit --no-fund
          node --test coordination/work/c07/faire-ensemble-pilot/purge.test.mjs
      - name: Concurrent purge and moderation in disposable PostgreSQL, no Supabase
        env:
          INTERSTICE_PURGE_LOCAL_TEST: '1'
        run: node --test coordination/work/c07/faire-ensemble-pilot/purge-concurrency.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Deno types and real SDK with denied network and environment
        run: |
          deno check --no-config --no-lock --no-remote --node-modules-dir=manual coordination/work/c07/faire-ensemble-pilot/submit-proposal.ts
          deno test --no-config --no-lock --no-remote --node-modules-dir=manual --deny-net --deny-env coordination/work/c07/faire-ensemble-pilot/submit-proposal.deno-test.ts
      - name: Camera, identities and editorial barriers
        run: node --test tests/nav01-camera.test.mjs tests/c06-ana-status-bridge.test.mjs tests/nav02-resource-bridge.test.mjs tests/c07-bundle.test.mjs tests/nav01-reading.test.mjs tests/nav01-editorial-review.test.mjs tests/nav01-editorial-queue.test.mjs tests/nav01-faire-ensemble-pilot.test.mjs
      - name: Preserve original files and exact reviewed security checkpoints
        run: |
          node --test coordination/work/c07/relieuse/check-reviewed-preservation.test.mjs
          node coordination/work/c07/relieuse/check-reviewed-preservation.mjs artifacts/nav01/preservation.json
      - name: Build allow-listed static preview without deploying
        run: node scripts/build-nav-preview.mjs
      - name: Install test tools only
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Responsive, simulated Android, keyboard, no-JS and real browser zoom
        run: node --test tests/nav01.browser.test.mjs
      - name: Existing R6 contracts and browser navigation, without deployment
        run: |
          python3 -m unittest discover -s coordination/agents -p 'test_*.py'
          node --test tests/r1-frontend-navigation.test.mjs tests/r2-faille-navigation.test.mjs tests/r4-relieuse-convergence.test.mjs tests/wiki-handoff-idempotency.test.mjs tests/wiki-handoff-sql-contract.test.mjs
          python3 -m http.server 8000 --bind 127.0.0.1 > artifacts/nav01/r6-server.log 2>&1 &
          nav_r6_pid=$!
          trap 'kill "$nav_r6_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 3 --retry-delay 1 --retry-connrefused --output /dev/null http://127.0.0.1:8000/
          node --test tests/r6-dev02-stabilisation.browser.test.mjs
      - name: Before and after immersive convergence, spatial nodes and landscape touch
        run: node --test tests/work-convergence-navigation.browser.test.mjs
      - name: Preserve preview, screenshots and exact HEAD
        if: always()
        run: |
          mkdir -p artifacts/nav01
          git rev-parse HEAD > artifacts/nav01/HEAD.txt
          git status --short > artifacts/nav01/working-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-nav01-preview-and-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            dist-nav/
            artifacts/nav01/
          retention-days: 14
