name: Graphiste R1 prototypes QA
on:
  push:
    branches: [design/graphiste-r1-logo-carte-20261102]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gra-r1.log 2>&1 &
          node --test tests/graphiste-r1-prototypes.test.mjs
