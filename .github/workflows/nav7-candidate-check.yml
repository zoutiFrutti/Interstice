name: NAV7 candidate isolated checks
on:
  push:
    branches:
      - work/nav7-accessible-prototype-20261113
      - work/c07-nav7-convergence-candidate-20261113
    paths:
      - nav7-candidate.html
      - explorer.html
      - assets/nav-01/**
      - assets/identite/r7/**
      - tests/nav7-candidate.test.mjs
      - tests/nav7-interactions.test.mjs
      - tests/nav7-browser.test.mjs
      - tests/nav7-convergence.test.mjs
      - coordination/work/c07/nav7/convergence-contract.json
      - .github/workflows/nav7-candidate-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nav7-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate NAV7 contract, links and fallback
        run: node --test tests/nav7-candidate.test.mjs tests/nav7-interactions.test.mjs tests/nav7-convergence.test.mjs
      - name: Build isolated unified navigation
        run: node scripts/build-nav-preview.mjs
      - name: Installer Chromium pour tests navigateur isolés
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Vérifier clavier, interactions et accès sans JavaScript sur Chromium
        run: node --test tests/nav7-browser.test.mjs
