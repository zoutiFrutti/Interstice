name: Anarchitecte - contrat documentaire 139 et liens Wiki
on:
  push:
    branches:
      - atelier/anarchitecte-contrat-editorial-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 139 references, veto editorial et 24 pages
        run: node --test tests/anarchitecte-cycle8-contract.test.mjs
