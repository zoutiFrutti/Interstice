name: Graphiste Parcours Critiques candidate QA
on:
  push:
    branches:
      - design/parcours-critiques-graphiste-2026-10-31
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/parcours.log 2>&1 &
          node --test tests/parcours-critiques-graphiste-2026-10-31.test.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphiste-parcours-critiques-a4
          path: artifacts/*
          retention-days: 14
          if-no-files-found: warn
