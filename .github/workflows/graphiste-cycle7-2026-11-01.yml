name: Graphiste Cycle7 candidate QA
on:
  push:
    branches: [design/graphiste-cycle7-medias-profils-2026-11-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/c7.log 2>&1 &
          node --test tests/graphiste-cycle7-2026-11-01.test.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphiste-cycle7-a4-captures
          path: artifacts/*
          retention-days: 14
          if-no-files-found: warn
