name: R1 convergence Graphiste Dev candidate
on:
  push:
    branches: [integration/r1-dev-graphiste-convergence-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/r1-frontend-navigation.test.mjs
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/interstice.log 2>&1 &
          node --test tests/r1-frontend-navigation.browser.test.mjs tests/graphiste-integration-20261102.test.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-graphiste-captures
          path: artifacts/graphiste/
          if-no-files-found: warn
