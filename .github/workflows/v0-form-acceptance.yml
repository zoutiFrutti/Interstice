name: V0 form acceptance
on:
  pull_request:
    paths:
      - 'script.js'
      - 'ressources.js'
      - 'tests/v0-form-acceptance.test.mjs'
      - '.github/workflows/v0-form-acceptance.yml'
  push:
    branches: [fix/anarchitecte-v0-acceptance-2026-10-30]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check script.js
      - run: node --check ressources.js
      - run: node --test tests/v0-form-acceptance.test.mjs
